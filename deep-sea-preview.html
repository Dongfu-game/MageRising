<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>심해 구역 미리보기</title><style>body{margin:0;background:#091323;color:#cce9f0;font:16px sans-serif}header{padding:14px;display:flex;flex-wrap:wrap;gap:10px}button,select{font:inherit;background:#183343;color:white;padding:8px;border:1px solid #52828d;border-radius:6px}canvas{width:100%;display:block}p{padding:0 16px}</style><header><select id="stage"><option value="201">201 수몰된 마을</option><option value="211">211 용궁 외곽</option><option value="241">241 침몰한 용궁</option><option value="281">281 심해의 왕좌</option><option value="250">250 크라켄</option><option value="300">300 타락한 용왕</option></select><select id="phase"><option value="1">1페이즈</option><option value="2">2페이즈</option><option value="3">3페이즈</option></select><button id="pause">일시정지</button><button id="map">지도 보기</button></header><canvas width="1000" height="400"></canvas><p>외형·공격 연출 미리보기입니다. 실제 게임 저장·골드·진행도에는 접근하지 않습니다. 보스 피해 횟수: <b id="hits">0</b></p><script src="js/deep-sea.js?v=0942"></script><script>
const ctx=document.querySelector('canvas').getContext('2d'),stage=document.getElementById('stage'),phase=document.getElementById('phase');let t=0,last=0,paused=false,map=false,e,hits=0;function reset(){e={id:1,boss:true,sideBoss:true,stage:+stage.value,phase:+phase.value,hp:100,maxHP:100,attack:1,attackCD:.5,breathClock:0};hits=0;}reset();stage.onchange=phase.onchange=reset;document.getElementById('pause').onclick=()=>paused=!paused;document.getElementById('map').onclick=()=>map=!map;function frame(ms){const dt=Math.min(.04,(ms-last)/1000||0);last=ms;if(!paused){t+=dt;MAGE_DEEP.tickBoss(e,dt,{locked:false,time:t,hp:100,dead:()=>false,damage:()=>hits++});}ctx.clearRect(0,0,1000,400);if(map){const im=new Image();im.src=MAGE_DEEP.map(+stage.value);if(im.complete)ctx.drawImage(im,0,0,1000,400);}else{MAGE_DEEP.background(ctx,t,+stage.value);MAGE_DEEP.floor(ctx);if(MAGE_DEEP.boss(+stage.value))MAGE_DEEP.bossArt(ctx,e,null,t);else for(let i=0;i<10;i++)MAGE_DEEP.enemy(ctx,{id:i,stage:+stage.value,x:80+i*94,y:300,size:24,seed:i},t);}document.getElementById('hits').textContent=hits;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
