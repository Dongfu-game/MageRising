<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>검사 스킬 이펙트 확인</title>
<style>body{margin:0;background:#101827;color:#e5e8f3;font:16px system-ui,sans-serif}header{padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,button{background:#293348;color:inherit;border:1px solid #68758e;border-radius:8px;padding:9px}small{color:#a9b6cf}canvas{display:block;width:100%;height:auto}p{margin:12px 18px;color:#a9b6cf}</style>
<header><strong>검사 스킬 이펙트</strong><select id="skill"></select><button id="slow">느리게 보기</button><small>1~8은 전장 위치 · 숫자는 게임에 표시되지 않음</small></header><canvas id="preview" width="1000" height="400"></canvas><p>이펙트 확인 전용입니다. 게임 저장 데이터는 읽거나 변경하지 않습니다.</p>
<script src="js/warrior-skills.js?v=0932"></script><script>
const names={slash:'일자베기',cross:'십자베기',spin:'회오리베기',thrust:'일점찌르기',triple:'삼연찌르기',pierce:'관통일섬',slam:'내려찍기',crush:'대지분쇄',quake:'지진'},select=document.getElementById('skill'),canvas=document.getElementById('preview'),ctx=canvas.getContext('2d');
for(const [value,label]of Object.entries(names))select.add(new Option(label,value));let start=performance.now(),slow=false;select.onchange=()=>start=performance.now();document.getElementById('slow').onclick=()=>{slow=!slow;start=performance.now();document.getElementById('slow').textContent=slow?'보통 속도':'느리게 보기';};
function frame(now){const id=select.value,t=MAGE_WARRIOR_SKILLS.timing(id),age=((now-start)/1000*(slow?.35:1))%(t.duration+.65);ctx.fillStyle='#141d30';ctx.fillRect(0,0,1000,400);ctx.strokeStyle='#34425b';ctx.beginPath();ctx.moveTo(0,300);ctx.lineTo(1000,300);ctx.stroke();ctx.font='15px sans-serif';ctx.textAlign='center';for(let i=1;i<=8;i++){ctx.fillStyle=i===1?'#9fb8e4':'#7788a5';ctx.fillText(i,i*125-15,355);ctx.fillRect(i*125,310,1,12);}const drawHero=()=>{ctx.fillStyle='#8b9ebc';ctx.beginPath();ctx.arc(185,230,16,0,Math.PI*2);ctx.fill();ctx.fillRect(176,248,18,50);ctx.fillText('검사',185,190);};if(id!=='pierce')drawHero();if(age<t.duration)MAGE_WARRIOR_SKILLS.draw(ctx,{warriorAttack:true,skill:id,start:id==='pierce'?125:250,end:1000,y:280,half:{slash:100,cross:130,spin:155,thrust:40,triple:45,pierce:55,slam:90,crush:140,quake:200}[id],...t,age});if(id==='pierce')drawHero();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
