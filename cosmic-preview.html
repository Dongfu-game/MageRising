<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>초월 마법 미리보기</title><style>body{margin:0;background:#101426;color:#e4dfff;font:16px sans-serif}header{padding:16px;display:flex;gap:12px;flex-wrap:wrap}button,select{font:inherit;padding:8px;background:#302744;color:white;border:1px solid #9d83bc;border-radius:6px}canvas{width:100%;display:block}p{padding:0 16px}</style><header><select id="spell"><option value="starfall">스타폴</option><option value="blackHole">블랙홀</option></select><button id="play">다시 재생</button><button id="pause">일시정지</button></header><canvas width="1000" height="400"></canvas><p>저장 데이터에 접근하지 않는 연출 미리보기 · 실제 게임에서는 기존 피해량과 범위를 유지합니다.</p><script src="js/cosmic-fx.js?v=0944"></script><script>const c=document.querySelector('canvas'),ctx=c.getContext('2d'),s=document.getElementById('spell');let f,t=0,last=0,paused=false;function reset(){f={cosmicFX:true,spell:s.value,age:0,duration:MAGE_COSMIC.plan(s.value).duration,x:680,y:260,r:200};}reset();s.onchange=document.getElementById('play').onclick=reset;document.getElementById('pause').onclick=()=>paused=!paused;function draw(ms){const dt=Math.min(.04,(ms-last)/1000||0);last=ms;if(!paused){t+=dt;f.age+=dt;if(f.age>f.duration+.8)reset();}ctx.fillStyle='#19243a';ctx.fillRect(0,0,1000,400);ctx.fillStyle='#0d1526';ctx.fillRect(0,300,1000,100);for(let i=0;i<5;i++){ctx.fillStyle='#576178';ctx.beginPath();ctx.ellipse(500+i*90,280,16,24,0,0,Math.PI*2);ctx.fill();}MAGE_COSMIC.dim(ctx,[f]);MAGE_COSMIC.draw(ctx,f);requestAnimationFrame(draw);}requestAnimationFrame(draw);</script></html>
